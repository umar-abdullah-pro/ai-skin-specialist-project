[project]
name = "ai-skin-specialist"
version = "0.1.0"
description = "Browser-based AI skin consultation with voice and image input"
readme = "README.md"
authors = [
    { name = "Umar Abdullah", email = "abdullahgilmannn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepgram-sdk>=7.16.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-skin-specialist = "ai_skin_specialist:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-include = ["src/ai_skin_specialist/web/**"]
