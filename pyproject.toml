[project]
name = "ai-skin-specialist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Umar Abdullah", email = "abdullahgilmannn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "deepgram-sdk>=7.16.0",
    "google-genai>=2.34.0",
    "gradio>=6.31.0",
    "openai>=3.42.1",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
    "speechrecognition>=3.17.0",
]

[project.scripts]
ai-skin-specialist = "ai_skin_specialist:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
